services:
  api:
    build: ..
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      # Строка подключения, чтобы база сохранялась в томе
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/videolibrary.db
    volumes:
      - db-data:/app/data
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "127.0.0.1:80:80"
      - "127.0.0.1:443:443"
    volumes:
      # Монтируем наш конфиг и папку с сертификатами
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../certs:/etc/nginx/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db-data: