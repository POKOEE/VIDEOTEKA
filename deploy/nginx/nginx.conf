server {
    listen 80;
    server_name videolibrary.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name videolibrary.localhost;

    ssl_certificate /etc/nginx/certs/videolibrary.localhost.pem;
    ssl_certificate_key /etc/nginx/certs/videolibrary.localhost-key.pem;

    location / {
        # 'api' - это имя сервиса из docker-compose.yml
        # 8080 - порт, на котором слушает ASP.NET в контейнере
        proxy_pass http://api:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}